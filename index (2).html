<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parallel Image Edge Detection & Performance Analysis</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px;
  font-family: Arial, sans-serif;
  background: #101827;
  color: #f1f5f9;
}

header {
  text-align: center;
  margin-bottom: 30px;
}

main {
  max-width: 1200px;
  margin: auto;
}

.images {
  display: flex !important;
  flex-direction: row !important;
  gap: 20px;
  width: 100%;
  align-items: stretch;
}

.images > .panel {
  flex: 1;
  min-width: 0;
}

.panel,
.metric {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
  min-width: 0;
}

.panel h3 {
  margin-top: 0;
  color: #e2e8f0;
}

.preview {
  width: 100%;
  height: 280px;
  border: 1px dashed #64748b;
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: #94a3b8;
  overflow: hidden;
  background: #172235;
  text-align: center;
}

.preview img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#imageInput {
  display: block;
  width: 100%;
  margin-top: 15px;
  color: #cbd5e1;
}

button {
  background: #38bdf8;
  color: #082f49;
  border: 0;
  border-radius: 8px;
  padding: 13px 22px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #7dd3fc;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
}

.metric {
  margin-bottom: 0;
}

.metric small {
  color: #94a3b8;
}

.metric h2 {
  color: #38bdf8;
  overflow-wrap: anywhere;
}

.note {
  color: #94a3b8;
  font-size: 13px;
  margin-top: 15px;
}

@media (max-width: 650px) {
  .metrics {
    grid-template-columns: 1fr;
  }

  body {
    padding: 16px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Parallel Image Edge Detection &amp; Performance Analysis</h1>
</header>

<main>

  <section class="images">

    <div class="panel">
      <h3>Original Image</h3>

      <div class="preview" id="original">
        <p>Select an image to get started.</p>
      </div>

      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="panel">
      <h3>Detected Edges</h3>

      <div class="preview" id="result">
        Run edge detection to see results.
      </div>
    </div>

  </section>

  <section class="panel">
    <h3>Performance Analysis</h3>

    <div class="metrics">

      <div class="metric">
        <small>Sequential Time</small>
        <h2 id="seq">—</h2>
      </div>

      <div class="metric">
        <small>Parallel Time</small>
        <h2 id="par">—</h2>
      </div>

      <div class="metric">
        <small>Speedup</small>
        <h2 id="speed">—</h2>
      </div>

    </div>

    <button onclick="runDemo()">Run Demo Preview</button>

    <p class="note" id="status">
      Demo preview only — live C++ execution is not connected yet.
    </p>
  </section>

</main>

<script>
function runDemo() {
  document.getElementById("seq").textContent = "0.123 s";
  document.getElementById("par").textContent = "0.033 s";
  document.getElementById("speed").textContent = "3.72×";

  document.getElementById("status").textContent =
    "Example results only. Live execution is not connected yet.";
}

document.getElementById("imageInput").addEventListener("change", function() {
  const file = this.files[0];

  if (file) {
    const imageURL = URL.createObjectURL(file);

    document.getElementById("original").innerHTML =
      '<img src="${imageURL}" alt="Original Image">';

    document.getElementById("result").textContent =
      "Image selected. Edge detection has not run yet.";
  }
});
</script>

</body>
</html>
